"""
Product Filter Condition
    EQ -> Equal
    NE -> Not Equal
    Note: Only EQ is supported at this time
"""
enum ProductFilterCondition {
  EQ
  NE
}

"""
Product fields that support filtering. 
    Type Designators: 
        I = integer,
        S = string,
        B = boolean
    Note: repeating designators (_II, _SS) indicate that the filter can be multi-valued (["Gain", "Colgate"])
"""
enum ProductFilterableField {
  COUPON_IDS_II
  CATEGORIES_SS
  MIX_MATCHES_II
  PRODUCT_IDS_SS
  BRANDS_SS
  HAS_PROMO_B
  IN_STOCK_B
  STORE_IDS
  ELIGIBILITIES_SS
}

