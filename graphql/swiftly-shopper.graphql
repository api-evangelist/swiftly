input AdParamInput {
  key: String!
  value: String!
}

input ChallengesCriteriaInput {
  """List of specific challenge ids to retrieve. Return all active challenges if null"""
  challengeIds: [String!]
  """Max number of challenges to return. Default value is 25 if null"""
  maxItems: Int
  """Used to request multiple pages of results. If a previous request has a pageToken value, add it here to get the next page of results."""
  pageToken: String
}

input KeyValuePairInput {
  key: String!
  value: String!
}

input KeywordSearchFilterInput {
  """The keyword search term to filter on. Example: food"""
  keyword: String!
}

input MixAndMatchFilterInput {
  """Filter by products that are part of this mix and match group."""
  mixAndMatchId: String!
}

input ProductCategoryFilterInput {
  """The product category to filter on."""
  taxonomyId: String!
}

input ProductCouponFilterInput {
  """Filter by products associated with this coupon."""
  couponId: String!
}

"""
Filter product search results by field values.
    For example: HAS_EBT_B (field) + EQ (condition) + ["true"] (values)
    OR: BRANDS_SS (field) + EQ (condition) + ["Gain", "Colgate"] (values)
"""
input ProductFieldFilterInput {
  """Matching condition"""
  condition: ProductFilterCondition!
  """Product field to filter on"""
  field: ProductFilterableField!
  """Values to match against"""
  values: [String!]!
}

input ProductIdFilterInput {
  """Filter products by ProductId"""
  plu: String!
}

"""At least one matcher MUST be supplied!"""
input ProductMatchInput {
  categories: [ProductCategoryFilterInput!]
  coupons: [ProductCouponFilterInput!]
  fieldFilters: [ProductFieldFilterInput!]
  mixAndMatch: MixAndMatchFilterInput
  productIds: [ProductIdFilterInput!]
  search: KeywordSearchFilterInput
}

