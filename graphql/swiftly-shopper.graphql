enum PriceModel {
  """The price model is unknown."""
  Unknown
  """The price model is not supported for the requested client."""
  NotSupported
  """com.swiftly.service.graphql.schema.viewmodel.product.Price is fixed amount. $1"""
  FixedPrice
  """Discount is fixed amount. $1 off"""
  FixedDiscount
  """Discount is some percent. 10% off."""
  PercentDiscount
  """com.swiftly.service.graphql.schema.viewmodel.product.Price is a split price (buy X for fixed price of Y). Shopper may have to meet eligibility requirements to qualify for the fixed price."""
  SplitPriceFixedPrice
  """Buy 3 and get $1 off"""
  SplitFixedDiscount
  """Buy 3 and get 10% off"""
  SplitPercentDiscount
  """Buy X at price, Get Y. Often referred to as BOGO."""
  BuyGetFixedPrice
  """Buy X at price, Get Y at a Fixed Discount."""
  BuyGetFixedDiscount
  """Buy X at price, Get Y at some Percent Discount."""
  BuyGetPercentDiscount
  """Buy X of any of a qualifying set of products and Get Y for fixed price ."""
  BuyGetMixAndMatchFixedPrice
  """Buy X of any of a qualifying set of products and Get Y at a Fixed Discount."""
  BuyGetMixAndMatchFixedDiscount
  """Buy X of any of a qualifying set of products and Get Y at some Percent Discount."""
  BuyGetMixAndMatchPercentDiscount
  """All qualifying products are being sold for a fixed price."""
  MixAndMatchFixedPrice
  """Buy X of any of a qualifying set of products for fixed price of Y."""
  MixAndMatchSplitPriceFixedPrice
  """All qualifying products are being given a fixed discount."""
  MixAndMatchFixedDiscount
  """All qualifying products are being a percent off."""
  MixAndMatchPercentDiscount
}

