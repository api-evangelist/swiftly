observations:
- >-
  Two parallel offer models ship side by side (Offer + the offersv2* / OfferV2Response
  family) with no deprecation marker on either. A consumer cannot tell from the schema
  which is current.
- >-
  StoreEntry is an interface rather than a type, so store shape is per-retailer. Any client
  binding to concrete store fields is binding to one tenant's implementation.
- >-
  Offer carries eight mutually exclusive *Parameters objects AND an offerParameters union
  covering the same ground — the union is the modelled path, the eight flat fields are the
  legacy path.
