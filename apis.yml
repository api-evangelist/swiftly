aid: swiftly

name: Swiftly

description: 'Swiftly (Swiftly Systems, Inc.) is a Seattle-based retail technology company
  that sells an AI platform purpose-built for grocery, convenience and wholesale retail.
  It powers white-labeled shopper mobile apps and websites for regional and independent
  retailers, and runs a multi-retailer closed-loop retail media network that lets brands
  buy targeted advertising against first-party shopper data. Products include the Marketing
  and Operations AI Stacks, Swiftly Connect (POS / loyalty / inventory / supplier data
  unification), Audience Optimizer, SmartCircular digital circulars, Alcohol Cashback
  (from the BYBE acquisition) and Retail Media. The company reports live transactions,
  9 million products and closed-loop campaign outcomes across roughly 33,000 storefronts.
  Swiftly has raised more than $200M and trades on the Forge Global secondary market.
  Swiftly publishes no public developer program: the shopper-facing GraphQL API behind
  its retailer apps was anonymously introspectable at prod.swiftlyapi.net/graphql until
  at least August 2026 and is now Bearer-gated, and
  there is no developer portal, no reference documentation and no published SDK.'

