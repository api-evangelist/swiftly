apis:
- aid: swiftly:shopper-graphql
  name: Swiftly Shopper GraphQL API
  description: 'The GraphQL API that backs Swiftly-built retailer mobile apps and websites.
    Exposes 45 queries and 11 mutations across offers and coupons, product catalog and
    barcode lookup, store and chain directories, digital flyers, loyalty programs, rewards
    and challenges, shopper accounts and age verification, and retail-media ad placements.
    The endpoint is not documented publicly. On 2026-08-05 anonymous introspection at
    prod.swiftlyapi.net/graphql returned a 308-type schema (saved verbatim in graphql/);
    on 2026-10-20 that path answered 404 and POST /api/graphql answered 401 with a Bearer
    challenge, so the live schema is now gated. Discovered from the Swiftly-built savemart.com storefront.'
  humanURL: https://swiftly.com/platform/app-web
  baseURL: https://prod.swiftlyapi.net
